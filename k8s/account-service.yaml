apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: ledgerops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: ledgerops-account-service:latest
          ports:
            - containerPort: 8001
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://ledgerops:ledgerops_dev_password@postgres:5432/ledgerops
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: ledgerops
spec:
  selector:
    app: account-service
  ports:
    - port: 8001
      targetPort: 8001
