apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ledgerops
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: transaction-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - transaction-service.ledgerops.svc.cluster.local:8002

      - job_name: fraud-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - fraud-service.ledgerops.svc.cluster.local:8003

  prometheus-rules.yaml: |
    groups:
      - name: ledgerops-sre
        interval: 30s
        rules:

          - record: ledgerops:transaction_request_rate_5m
            expr: |
              sum(rate(ledgerops_http_requests_total{job="transaction-service"}[5m]))

          - record: ledgerops:transaction_error_rate_5m
            expr: |
              sum(rate(ledgerops_http_requests_total{
                job="transaction-service",
                status=~"5.."
              }[5m]))

          - record: ledgerops:fraud_rejection_rate_5m
            expr: |
              sum(rate(ledgerops_fraud_checks_total{
                job="fraud-service",
                result="rejected"
              }[5m]))

          - record: ledgerops:fraud_check_rate_5m
            expr: |
              sum(rate(ledgerops_fraud_checks_total{
                job="fraud-service"
              }[5m]))

          - record: ledgerops:transaction_p95_latency_5m
            expr: |
              histogram_quantile(
                0.95,
                sum by (le) (
                  rate(ledgerops_http_request_duration_seconds_bucket{
                    job="transaction-service"
                  }[5m])
                )
              )

          - record: ledgerops:transaction_success_ratio_5m
            expr: |
              1 -
              (
                sum(rate(ledgerops_http_requests_total{
                  job="transaction-service",
                  status=~"5.."
                }[5m]))
                /
                clamp_min(
                  sum(rate(ledgerops_http_requests_total{
                    job="transaction-service"
                  }[5m])),
                  0.000001
                )
              )

          - record: ledgerops:fraud_rejection_ratio_5m
            expr: |
              sum(rate(ledgerops_fraud_checks_total{
                job="fraud-service",
                result="rejected"
              }[5m]))
              /
              clamp_min(
                sum(rate(ledgerops_fraud_checks_total{
                  job="fraud-service"
                }[5m])),
                0.000001
              )

      - name: ledgerops-alerts
        rules:

          - alert: LedgerOpsTransactionServiceDown
            expr: up{job="transaction-service"} == 0
            for: 2m
            labels:
              severity: critical
              service: transaction-service
            annotations:
              summary: "Transaction Service is down"
              description: "Prometheus cannot scrape the LedgerOps Transaction Service."

          - alert: LedgerOpsFraudServiceDown
            expr: up{job="fraud-service"} == 0
            for: 2m
            labels:
              severity: critical
              service: fraud-service
            annotations:
              summary: "Fraud Service is down"
              description: "Prometheus cannot scrape the LedgerOps Fraud Service."

          - alert: LedgerOpsHighTransactionErrorRate
            expr: |
              (
                sum(rate(ledgerops_http_requests_total{
                  job="transaction-service",
                  status=~"5.."
                }[5m]))
                /
                clamp_min(
                  sum(rate(ledgerops_http_requests_total{
                    job="transaction-service"
                  }[5m])),
                  0.000001
                )
              ) > 0.05
            for: 5m
            labels:
              severity: warning
              service: transaction-service
            annotations:
              summary: "High Transaction Service error rate"
              description: "More than 5% of Transaction Service requests are returning 5xx responses."

          - alert: LedgerOpsHighTransactionLatency
            expr: ledgerops:transaction_p95_latency_5m > 0.5
            for: 5m
            labels:
              severity: warning
              service: transaction-service
            annotations:
              summary: "High transaction latency"
              description: "Transaction Service p95 latency is above 500ms."

          - alert: LedgerOpsHighFraudRejectionRate
            expr: ledgerops:fraud_rejection_ratio_5m > 0.50
            for: 5m
            labels:
              severity: warning
              service: fraud-service
            annotations:
              summary: "High fraud rejection ratio"
              description: "More than 50% of fraud checks are being rejected."

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ledgerops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.8.0
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time=7d
            - --web.enable-lifecycle
          ports:
            - name: http
              containerPort: 9090
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
              readOnly: true
            - name: config
              mountPath: /etc/prometheus/rules
              readOnly: true
              subPath: rules
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 20
      volumes:
        - name: config
          projected:
            sources:
              - configMap:
                  name: prometheus-config
                  items:
                    - key: prometheus.yml
                      path: prometheus.yml
                    - key: prometheus-rules.yaml
                      path: rules/prometheus-rules.yaml
        - name: data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ledgerops
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-dashboards-info
  namespace: ledgerops
data:
  README: |
    LedgerOps Prometheus observability stack.
    Metrics are exposed by Transaction Service and Fraud Service.
    Grafana will consume Prometheus at:
    http://prometheus.ledgerops.svc.cluster.local:9090
